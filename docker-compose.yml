version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: tianji-server
    ports:
      - "3001:3001"
    environment:
      - SERVER_PORT=3001
      - JWT_SECRET=\
      - JWT_EXPIRES_IN=7d
      - DATABASE_URL=file:./data/prod.db
      - NODE_ENV=production
      - RUN_SEED=false
    volumes:
      - server-data:/app/prisma/data
      - uploads:/app/uploads
    restart: unless-stopped
    networks:
      - tianji-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tianji-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tianji-net

volumes:
  server-data:
  uploads:

networks:
  tianji-net:
    driver: bridge

